function summary(){const n=db.requests.length,active=db.requests.filter(r=>r.status==='publicada').length,matched=db.requests.filter(r=>r.winner).length,trips=db.requests.filter(r=>r.trip&&r.status!=='finalizada').length;let stats=current.role==='cliente'?[stat('📦','Mis solicitudes',db.requests.filter(mine).length,'Cargas registradas'),stat('🟡','Cotizaciones recibidas',db.requests.filter(mine).reduce((a,r)=>a+r.negotiations.length,0),'Transportistas interesados'),stat('🤝','Acuerdos',db.requests.filter(r=>mine(r)&&r.winner).length),stat('🚚','Envíos activos',db.requests.filter(r=>mine(r)&&r.trip&&r.status!=='finalizada').length)]:current.role==='transportista'?[stat('📦','Cargas abiertas',active),stat('💬','Mis negociaciones',db.requests.filter(r=>negotiate(r,current.id)).length),stat('🤝','Servicios asignados',db.requests.filter(r=>r.winner===current.id).length),stat('🚚','Viajes activos',db.requests.filter(r=>r.winner===current.id&&r.trip&&r.status!=='finalizada').length)]:[stat('📦','Cargas publicadas',n),stat('💬','Ofertas totales',db.requests.reduce((a,r)=>a+r.negotiations.length,0)),stat('🤝','Acuerdos',matched),stat('🚚','Viajes activos',trips)];return title('Hola, '+current.name.split(' ')[0]+' 👋','Vista general de tu actividad en SmartTransfer','<button class="btn navy" onclick="go(\''+(current.role==='cliente'?'publicar':current.role==='transportista'?'mercado':'viajes')+'\')">'+(current.role==='cliente'?'＋ Nueva solicitud':current.role==='transportista'?'Ver cargas disponibles':'Ver viajes')+'</button>')+`<div class="grid stats">${stats.join('')}</div><div class="banner"><div><b style="font-size:21px">${current.role==='cliente'?'Tu carga, más opciones de transporte':current.role==='transportista'?'Aprovecha cada ruta y cada viaje':'Operaciones bajo control'}</b><p>${current.role==='cliente'?'Publica solicitudes, recibe varias ofertas y elige la más conveniente.':current.role==='transportista'?'Consulta solicitudes disponibles, envía propuestas y negocia.':'Consulta function negotiatePage(){let list=db.requests.filter(r=>current.role==='transportista'?negotiate(r,current.id):true).filter(r=>r.negotiations.length);return title('Negociaciones','Historial de propuestas y contraofertas por solicitud.')+card('Propuestas',list.map(r=>`<div class="item"><div class="row between"><b>${fmtId(r)} — ${esc(r.title)}</b>${pill(r.status)}</div>${r.negotiations.filter(n=>current.role==='transportista'?n.carrier===current.id:true).map(n=>`<div class="quote"><div class="row between"><span>${esc(user(n.carrier).company)}</span><b>${money(n.amount)}</b><span class="pill">${esc(n.status)}</span></div><div class="smallprint">${n.history.length} movimiento(s)</div></div>`).join('')}<button class="btn outline tiny" onclick="openRequest(${r.id})">Abrir negociación</button></div>`).join('')||'<div class="empty">Sin propuestas todavía</div>')}

function openRequest(id){let r=req(id);if(!r)return;focused=id;let content=`<div class="row between"><h2>${fmtId(r)} · ${esc(r.title)}</h2>${pill(r.status)}</div><img class="productcover" src="${img(r.photo)}" alt="Tipo de mercancía"><div class="fieldgrid" style="margin-top:12px"><div><span class="label">Origen</span>${esc(r.origin)}</div><div><span class="label">Destino</span>${esc(r.destination)}</div><div><span class="label">Fecha de recojo</span>${esc(r.pickup)}</div><div><span class="label">Peso / volumen</span>${r.weight} kg · ${r.volume||'—'} m³</div><div><span class="label">Bultos</span>${r.units}</div><div><span class="label">Presupuesto de referencia</span><b>${money(r.price)}</b></div></div><p class="muted" style="margin-top:12px">${esc(r.description)}</p><hr class="divider"><h3>Ofertas y negociación</h3>`;
if(current.role==='transportista'&&r.status==='publicada'&&!negotiate(r,current.id))content+=`<div class="light"><b>Enviar primera propuesta</b><form id="offer"><input type="hidden" name="rid" value="${id}"><label class="label">Mi cotización (S/)</label><input type="number" name="price" value="${Math.round(r.price*.95)}" min="1" required><label class="label">Nota al cliente</label><input name="note" value="Unidad disponible, recojo coordinado y entrega segura"><button class="btn primary" style="margin-top:12px">Enviar oferta</button></form></div>`;
const offers=r.negotiations.filter(n=>current.role!=='transportista'||n.carrier===current.id);content+=offers.map(n=>`<div class="item"><div class="row between"><b>${esc(user(n.carrier).company)}</b><span class="amount">${money(n.amount)}</span><span class="pill ${n.status==='aceptada'?'green':n.status==='rechazada'?'red':'amber'}">${n.status}</span></div><div class="timeline">${n.history.map(h=>`<div class="event"><b>${esc(user(h.by).name)}</b> · ${esc(h.action)} ${h.amount?money(h.amount):''}<br><span class="smallprint">${esc(h.at)} ${esc(h.note||'')}</span></div>`).join('')}</div>${n.status==='abierta'&&r.status==='publicada'?`<div class="actions">${current.role==='cliente'?`<button class="btn primary tiny" onclick="acceptOffer(${id},'${n.carrier}')">Aceptar</button><button class="btn danger tiny" onclick="rejectOffer(${id},'${n.carrier}')">Rechazar</button>`:''}${((current.role==='cliente'&&n.turn==='cliente')||(current.id===n.carrier&&n.turn==='transportista'))?`<button class="btn navy tiny" onclick="counterForm(${id},'${n.carrier}')">Contraofertar</button>`:`<span class="smallprint">Esperando respuesta de ${n.turn==='cliente'?'cliente':'transportista'}</span>`}</div>`:''}</div>`).join('');if(!offers.length)content+='<div class="empty">Sin ofertas de transportistas todavía.</div>';if(r.trip)content+=`<div class="alert good">✓ Acuerdo cerrado con ${esc(user(r.winner).company)}. <button class="btn tiny navy" onclick="openTrip(${id})">Seguir viaje</button></div>`;modal(content);bindForms()}
function counterForm(id,carrier){const r=req(id),n=negotiate(r,carrier);if(!n||n.status!=='abierta')return;modal(`<h2>Enviar contraoferta · ${fmtId(r)}</h2><p>Propuesta actual: <b>${money(n.amount)}</b></p><form id="counter"><input type="hidden" name="rid" value="${id}"><input type="hidden" name="carrier" value="${carrier}"><label class="label">Nuevo importe negociado (S/)</label><input name="price" required type="number" min="1" value="${n.amount+((current.role==='cliente')?-100:90)}"><label class="label">Observación</label><input name="note" value="Propuesta ajustada por ruta y volumen"><button class="btn primary" style="margin-top:13px">Enviar contraoferta</button></form>`);bindForms()}
function newOffer(id,price,note){const r=req(id);if(!r||r.status!=='publicada'||negotiate(r,current.id))return;const n={carrier:current.id,amount:price,status:'abierta',turn:'cliente',history:[{by:current.id,action:'Ofertó',amount:price,note,at:now()}]};r.negotiations.push(n);audit(`${user(current.id).name} presentó oferta de ${money(price)} en ${fmtId(r)}`);notify([r.client],`${user(current.id).company} envió una oferta de ${money(price)} para ${fmtId(r)}`);save();modalClose();render();toast('Oferta enviada. El cliente podrá verla al iniciar sesión.')}
function counter(id,carrier,price,note){const r=req(id),n=negotiate(r,carrier);if(!r||!n||r.status!=='publicada'||n.status!=='abierta')return;const role=current.id===r.client?'cliente':'transportista';if(current.id!==r.client&&current.id!==carrier||n.turn!==role){toast('No corresponde tu turno de negociación');return}n.amount=price;n.turn=role==='cliente'?'transportista':'cliente';n.history.push({by:current.id,action:'Contraofertó',amount:price,note,at:now()});const other=current.id===r.client?carrier:r.client;notify([other],`Nueva contraoferta por ${money(price)} para ${fmtId(r)}`);audit(`Contraoferta en ${fmtId(r)} por ${money(price)}`);save();openRequest(id);toast('Contraoferta enviada')}
function rejectOffer(id,carrier){const r=req(id),n=negotiate(r,carrier);if(current.id!==r.client||!n||r.status!=='publicada')return;n.status='rechazada';n.history.push({by:current.id,action:'Rechazó',at:now()});notify([carrier],`Tu oferta para ${fmtId(r)} fue rechazada.`);audit(`Oferta rechazada en ${fmtId(r)}`);save();openRequest(id)}
function acceptOffer(id,carrier){const r=req(id),n=negotiate(r,carrier);if(current.id!==r.client||!n||r.status!=='publicada'||n.status!=='abierta')return;const amount=n.amount;n.status='aceptada';n.history.push({by:current.id,action:'Aceptó',amount,at:now()});r.negotiations.filter(x=>x!==n&&x.status==='abierta').forEach(x=>{x.status='cerrada';notify([x.carrier],`La solicitud ${fmtId(r)} fue asignada a otro transportista.`)});r.winner=carrier;r.status='asignada';r.trip={amount,stage:0,eta:'',events:[{at:now(),text:'Acuerdo confirmado: '+user(carrier).company}],payment:{deposit:Math.round(amount*.3*100)/100,depositPaid:false,balancePaid:false,depositMethod:'',balanceMethod:''}};notify([carrier],`¡Oferta aceptada! Tienes un servicio asignado: ${fmtId(r)}`);audit(`${fmtId(r)} asignada a ${user(carrier).company} por ${money(amount)}`);save();openRequest(id);toast('Acuerdo confirmado. Ya puedes seguir el viaje.')}
function matchAvailability(id){const a=db.availability.find(x=>x.id===id);if(!a||current.role!=='cliente')return;modal(`<h2>Solicitar transporte disponible</h2><p class="muted">Ruta publicada por ${esc(user(a.carrier).company)}: ${esc(a.origin)} → ${esc(a.destination)}</p><form id="availabilityMatch"><input type="hidden" name="aid" value="${id}"><label class="label">¿Qué necesitas transportar?</label><input name="title" required value="Mercadería para aprovechar ruta disponible"><div class="fieldgrid"><div><label class="label">Peso (kg)</label><input name="weight" type="number" min="1" max="${a.capacity}" required value="550"></div><div><label class="label">Bultos</label><input name="units" type="number" min="1" required value="8"></div></div><label class="label">Precio propuesto (S/)</label><input name="price" type="number" min="1" required value="${a.price}"><label class="label">Indicaciones</label><textarea name="description">Caja sellada, coordinación de horario de recojo y entrega.</textarea><button class="btn primary">Publicar y solicitar oferta →</button></form>`);bindForms()}
function closeAvailability(id){const a=db.availability.find(x=>x.id===id);if(a&&a.carrier===current.id){a.active=false;audit(`Disponibilidad de ${current.name} desactivada`);render()}}
function openTrip(id){const r=req(id);if(!r||!r.trip)return;const t=r.trip;const controls=current.role==='transportista'&&r.winner===current.id;let content=`<div class="row between"><h2>${fmtId(r)} · Seguimiento del envío</h2><span class="pill green">${STAGES[t.stage]}</span></div><p>${esc(r.origin)} → ${esc(r.destination)}</p><div class="light"><div class="row between"><span>Progreso de traslado</span><b>${Math.round(t.stage/6*100)} %</b></div><div class="progress"><div style="width:${Math.round(t.stage/6*100)}%"></div></div><div class="stage">${['Salida','Recojo','Recuay','Barranca','Llegada'].map((s,i)=>`<span class="${t.stage>=Math.min(6,i+1)?'done':''}">${s}</span>`).join('')}</div><p class="muted">Hitos ilustrativos de una ruta Huaraz–Lima. No representan GPS, tiempos ni ubicación reales.</p></div><h3 style="margin-top:16px">Estado del conductor</h3><p><b>${esc(user(r.winner).name)}</b> · ${esc(user(r.winner).truck)} · ${esc(user(r.winner).plate)}</p><p class="muted">${esc(t.eta||'Tiempo de llegada pendiente de actualización por el transportista')}</p>`;
if(controls&&t.stage<6)content+=`<div class="light"><b>Actualizar avance del viaje</b><form id="stage"><input name="rid" type="hidden" value="${id}"><label class="label">Siguiente hito</label><select name="stage">${STAGES.map((s,i)=>i>t.stage?`<option value="${i}" ${i===t.stage+1?'selected':''}>${s}</option>`:'').join('')}</select><label class="label">ETA o mensaje para el cliente</label><input name="eta" placeholder="Ej. Llegada estimada en 45 minutos" value="${esc(t.eta)}"><button class="btn primary" style="margin-top:12px">Actualizar y notificar al cliente</button></form></div>`;
content+=`<h3 style="margin-top:18px">Movimientos del servicio</h3><div class="timeline">${t.events.map(e=>`<div class="event"><b>${esc(e.text)}</b><br><span class="smallprint">${esc(e.at)}</span></div>`).join('')}</div><hr class="divider"><div class="row between"><b>Pago: ${money(t.amount)}</b>${current.role==='cliente'?`<button class="btn navy tiny" onclick="openPayment(${id})">Ver pagos</button>`:''}</div><p class="smallprint">El anticipo recomendado es el 30% al confirmar; el saldo, al confirmar la entrega. Política solo ilustrativa.</p>`;modal(content);bindForms()}
function openPayment(id){const r=req(id);if(!r||!r.trip||current.role!=='cliente')return;const p=r.trip.payment,dep=p.deposit,bal=r.trip.amount-dep;modal(`<h2>Pago del servicio · ${fmtId(r)}</h2><p class="muted">Transportista: ${esc(user(r.winner).company)}</p><div class="grid two"><div class="light"><span class="muted">Tarifa acordada</span><div class="big-number">${money(r.trip.amount)}</div><p class="small">Anticipo 30%: <b>${money(dep)}</b><br>Saldo 70%: <b>${money(bal)}</b></p></div><div class="light"><b>Estado</b><p>${p.depositPaid?'✅ Anticipo marcado como pagado':'○ Anticipo pendiente'}</p><p>${p.balancePaid?'✅ Saldo marcado como pagado':'○ Saldo pendiente'}</p></div></div><div class="alert warn">Demostración: no conectada con Yape ni bancos. Ningún botón efectúa cobros.</div>${!p.depositPaid?paymentForm(id,'deposit',dep):!p.balancePaid?paymentForm(id,'balance',bal):'<div class="alert good">✓ El servicio figura como pagado en la simulación.</div>'}`);bindForms()}
function paymentForm(id,kind,amount){return `<form id="pay"><input type="hidden" name="rid" value="${id}"><input type="hidden" name="kind" value="${kind}"><h3>${kind==='deposit'?'Registrar anticipo':'Registrar saldo'} · ${money(amount)}</h3><label class="label">Método de pago simulado</label><select name="method"><option>Yape (simulado)</option><option>Tarjeta (pasarela simulada)</option><option>Transferencia bancaria (simulada)</option></select><label class="label">Referencia opcional (solo datos de ejemplo)</label><input name="reference" placeholder="ST-DEMO-001"><button class="btn primary" style="margin-top:12px">Confirmar pago de demostración</button></form>`}
function openNotifications(){const notes=db.notifications.filter(n=>n.user===current.id);notes.forEach(n=>n.read=true);save();modal(`<h2>Centro de notificaciones</h2>${notes.map(n=>`<div class="notice"><b>${esc(n.at)}</b><br>${esc(n.message)}</div>`).join('')||'<div class="empty">Sin notificaciones</div>'}`);renderShell()}
function modal(content){$('modalroot').innerHTML=`<div class="modalback" onclick="if(event.target===this)modalClose()"><div class="modal"><div class="modalhead"><span class="app-demo">SmartTransfer · Demo</span><button class="btn outline tiny" onclick="modalClose()">✕ Cerrar</button></div><div style="margin-top:17px">${content}</div></div></div>`}
function modalClose(){$('modalroot').innerHTML=''}
function bindForms(){const on=(id,handler)=>{const f=$(id);if(f)f.onsubmit=e=>{e.preventDefault();handler(Object.fromEntries(new FormData(f)))}};
on('publish',d=>{const r={id:db.next++,client:current.id,title:d.title,origin:d.origin,destination:d.destination,pickup:d.pickup,weight:+d.weight,units:+d.units,volume:+d.volume,price:+d.price,description:d.description,photo:d.photo,status:'publicada',created:now(),negotiations:[],winner:null,trip:null};db.requests.unshift(r);audit(`Solicitud ${fmtId(r)} publicada por ${current.name}`);notify(USERS.filter(u=>u.role==='transportista').map(u=>u.id),`Nueva carga ${fmtId(r)}: ${r.origin} → ${r.destination}, ${money(r.price)} referencia`);save();go('solicitudes');toast('Solicitud publicada y visible para tres transportistas.');});
on('offer',d=>newOffer(+d.rid,+d.price,d.note));on('counter',d=>counter(+d.rid,d.carrier,+d.price,d.note));on('available',d=>{db.availability.unshift({id:Date.now(),carrier:current.id,origin:d.origin,destination:d.destination,date:d.date,capacity:+d.capacity,price:+d.price,details:d.details,active:true});audit(`${current.name} publicó una ruta disponible`);notify(USERS.filter(u=>u.role==='cliente').map(u=>u.id),`Camión con espacio libre: ${d.origin} → ${d.destination}, ${money(d.price)}`);save();render();toast('Disponibilidad publicada para los clientes')});
on('availabilityMatch',d=>{const a=db.availability.find(x=>x.id===+d.aid);if(!a)return;const r={id:db.next++,client:current.id,title:d.title,origin:a.origin,destination:a.destination,pickup:a.date,weight:+d.weight,units:+d.units,volume:2,price:+d.price,description:d.description,photo:'boxes',status:'publicada',created:now(),negotiations:[],winner:null,trip:null};db.requests.unshift(r);audit(`Solicitud ${fmtId(r)} creada desde disponibilidad de ${user(a.carrier).company}`);notify([a.carrier],`Solicitud directa de cotización ${fmtId(r)} por una ruta que publicaste`);save();modalClose();go('solicitudes');toast('Solicitud creada. El transportista puede enviar su oferta.')});
on('stage',d=>{const r=req(+d.rid),t=r?.trip;if(!t||r.winner!==current.id)return;const next=+d.stage;if(next<=t.stage)return;t.stage=next;t.eta=d.eta;t.events.push({at:now(),text:STAGES[next]+(d.eta?' · '+d.eta:'')});if(next>=4&&next<=5)r.status='en_ruta';if(next===6)r.status='entregada';notify([r.client],`${fmtId(r)}: ${STAGES[next]}.${d.eta?' '+d.eta:''}`);audit(`Hito ${STAGES[next]} registrado en ${fmtId(r)}`);save();openTrip(r.id);toast('Estado actualizado. Cliente notificado.');});
on('pay',d=>{const r=req(+d.rid);if(!r||r.client!==current.id)return;const p=r.trip.payment,k=d.kind;if(k==='deposit'){p.depositPaid=true;p.depositMethod=d.method}else if(k==='balance'){if(!p.depositPaid){toast('Primero registra el anticipo');return}p.balancePaid=true;p.balanceMethod=d.method;if(r.trip.stage===6)r.status='finalizada'}else return;r.trip.events.push({at:now(),text:`${k==='deposit'?'Anticipo':'Saldo'} registrado: ${d.method}`});notify([r.winner],`${fmtId(r)}: ${k==='deposit'?'Anticipo':'Saldo'} registrado mediante ${d.method}`);audit(`${fmtId(r)}: ${k==='deposit'?'anticipo':'saldo'} simulado registrado`);save();openPayment(r.id);toast('Pago simulado registrado (sin movimiento de fondos)')});}
function resetDemo(){if(!confirm('¿Restaurar todos los datos de la demostración? Se borrarán las acciones simuladas guardadas en este navegador.'))return;db=seed();save();modalClose();go('resumen');toast('Datos originales restaurados')}

// SmartTransfer Pitch V3: extensiones de simulación exclusivamente local.
const origRenderContent=renderContent,origNavItems=navItems,origOpenRequest=openRequest,origRequestItem=requestItem,origAvailabilityPage=availabilityPage,origUsersPage=usersPage,origSummary=summary,origPaymentForm=paymentForm,origProfilePage=profilePage,origRenderShell=renderShell;
const onlineNote=n=>`<div class="notice ${esc(n.type||'info')}"><b>${esc(n.at)} · ${esc(({offer:'Nueva oferta',cargo:'Carga / match',success:'Confirmación',error:'Atención',info:'Actualización'})[n.type]||'Actualización')}</b><div>${esc(n.message)}</div></div>`;
renderLogin=function(){ $('login').innerHTML=`<div class="login-art"><p class="eyebrow">Plataforma de carga · Perú</p><div class="logo"><span class="mark">↗</span> SmartTransfer</div><div style="margin-top:16vh"><h1>Más opciones para tu carga. Más oportunidades para tu transporte.</h1><p>Cotiza, negocia y coordina el transporte desde una sola plataforma.</p><span class="pill amber">Entorno de demostración · Sin cobros reales</span></div></div><div class="login-cardwrap"><div class="login-card"><div class="logo"><span class="mark">↗</span> SmartTransfer</div><h2 style="margin:25px 0 5px">Bienvenido</h2><p class="muted">Ingresa con tu correo electrónico.</p><form id="loginform"><label class="label">Correo electrónico</label><input id="email" type="email" required placeholder="nombre@empresa.com" autocomplete="off"><button class="btn primary full" style="margin-top:15px">Iniciar sesión →</button></form><p class="muted small" style="margin-top:20px">¿Todavía no tienes una cuenta?</p><button class="btn outline full" onclick="showSignup()">Solicitar acceso a SmartTransfer</button><p class="smallprint" style="margin-top:20px">Acceso local de demostración. Las nuevas cuentas requieren aprobación de Operaciones. No ingreses datos personales ni financieros reales.</p></div></div>`; $('loginform').onsubmit=e=>{e.preventDefault();login($('email').value)};};
login=function(email){let found=USERS.find(u=>u.email===String(email).trim().toLowerCase());if(!found){const pending=db.registrations.find(x=>x.email===String(email).trim().toLowerCase());toast(pending?pending.status==='rechazada'?'Solicitud rechazada. Contacta a Operaciones.':'Tu cuenta está pendiente de validación por Operaciones.':'Correo no habilitado. Solicita una cuenta o utiliza un acceso de la demo.');return}current=found;sessionStorage.setItem(SESSION,found.id);tab='resumen';render();toast('Sesión iniciada: '+found.name)};
function showSignup(){modal(`<h2>Solicitar una cuenta</h2><p class="muted">Operaciones revisará la solicitud antes de habilitar tu acceso.</p><form id="signup"><label class="label">Tipo de cuenta *</label><select name="role" onchange="document.getElementById('carrierfields').style.display=this.value==='transportista'?'block':'none'"><option value="cliente">Cliente / remitente</option><option value="transportista">Transportista</option></select><div class="fieldgrid"><div><label class="label">Nombre completo *</label><input name="name" required minlength="5" placeholder="Nombre y apellidos"></div><div><label class="label">Correo electrónico *</label><input name="email" type="email" required></div><div><label class="label">Teléfono *</label><input name="phone" required pattern="[0-9 +()-]{9,18}" placeholder="9XXXXXXXX"></div><div><label class="label">Documento (DNI o RUC) *</label><input name="document" required pattern="[0-9]{8}|[0-9]{11}" placeholder="8 u 11 dígitos"></div><div><label class="label">Ciudad *</label><input name="city" required></div><div><label class="label">Empresa / razón social (opcional)</label><input name="company"></div></div><div id="carrierfields" style="display:none"><h3 style="margin-top:15px">Información del transportista</h3><div class="fieldgrid"><div><label class="label">Placa *</label><input name="plate" placeholder="ABC-123"></div><div><label class="label">Tipo de vehículo *</label><input name="truck" placeholder="Camión furgón 5 t"></div><div><label class="label">Licencia de conducir *</label><input name="license" placeholder="Número de licencia"></div><div><label class="label">Capacidad de carga en kg *</label><input name="capacity" type="number" min="1"></div></div></div><label class="label">Información adicional (opcional)</label><textarea name="notes" placeholder="Referencias, tipo de mercancías y rutas frecuentes"></textarea><button class="btn primary full" style="margin-top:12px">Enviar solicitud de registro</button></form><p class="hint">* Campos obligatorios. Los documentos son declarativos para la simulación; no se verifica su autenticidad.</p>`);const f=$('signup'); f.elements.role.onchange=()=>{const b=f.elements.role.value==='transportista';$('carrierfields').style.display=b?'block':'none';for(const name of ['plate','truck','license','capacity'])f.elements[name].required=b};f.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f)),email=d.email.toLowerCase().trim();if(USERS.some(u=>u.email===email)||db.registrations.some(x=>x.email===email)){toast('El correo ya está registrado o pendiente.');return}const rid='reg'+Date.now();const u={id:rid,email,name:d.name,role:d.role,phone:d.phone,document:d.document,city:d.city,company:d.company||d.name,truck:d.truck||'',plate:d.plate||'',license:d.license||'',capacity:d.capacity||'',initials:d.name.split(' ').slice(0,2).map(x=>x[0]).join('').toUpperCase()};db.registrations.unshift({id:rid,email,user:u,status:'pendiente',notes:d.notes,created:now()});audit('Nueva solicitud de registro: '+u.name+' ('+u.role+')');notify(['op1'],'Registro pendiente de aprobación: '+u.name+' ('+u.role+')','cargo');save();modalClose();toast('Solicitud enviada. Operaciones debe validar tu acceso.')};}
navItems=function(){let a=origNavItems();if(current.role==='operaciones')a.splice(a.length-1,0,['registros','✓','Validar registros'],['consultas','✉','Centro de consultas']);else a.splice(a.length-1,0,['consultas','✉','Consultas']);return a};
renderContent=function(){if(tab==='registros'){$('content').innerHTML=registrationsPage();return}if(tab==='consultas'){$('content').innerHTML=inquiriesPage();bindForms();return}origRenderContent()};
renderShell=function(){origRenderShell();const unread=db.notifications.filter(n=>n.user===current.id&&!n.read);if(unread.length){const btn=$('topbar').querySelector('button[onclick="openNotifications()"]');if(btn)btn.innerHTML='🔔 Notificaciones <span class="inbox-count">'+unread.length+'</span>'}}
summary=function(){const top=db.notifications.filter(n=>n.user===current.id).slice(0,4);return `<div class="alert-strong"><b>Actividad de tu cuenta</b><div class="hint">${db.notifications.filter(n=>n.user===current.id&&!n.read).length} aviso(s) sin leer · Selecciona cualquier carga para ver ruta, peso, fecha y cotizaciones.</div>${top.map(onlineNote).join('')}</div>`+origSummary()};
requestItem=function(r){return `<div class="metrics-row"><div class="metric"><span>ORIGEN</span><b>${esc(r.origin)}</b></div><div class="metric"><span>DESTINO</span><b>${esc(r.destination)}</b></div><div class="metric"><span>PRESUPUESTO</span><b>${money(r.price)}</b></div></div>`+origRequestItem(r)};
openNotifications=function(){let a=db.notifications.filter(n=>n.user===current.id);a.forEach(n=>n.read=true);save();modal(`<h2>Centro de notificaciones</h2><p class="muted">Azul: ofertas · Amarillo: cargas y matches · Verde: confirmaciones · Rojo: alertas.</p>${a.map(onlineNote).join('')||'<div class="empty">Sin notificaciones</div>'}`);renderShell()};
function registrationsPage(){if(current.role!=='operaciones')return '';const groups=['pendiente','aprobada','rechazada'];return title('Validación de cuentas','Clientes y transportistas separados. El acceso se habilita únicamente al aprobar la solicitud.')+groups.map(g=>card(`Solicitudes ${g}s`,['cliente','transportista'].map(role=>`<h3>${role==='cliente'?'Clientes':'Transportistas'}</h3>${db.registrations.filter(x=>x.status===g&&x.user.role===role).map(x=>`<div class="item"><div class="row between"><div><b>${esc(x.user.name)}</b><p>${esc(x.user.email)} · ${esc(x.user.city)} · ${esc(x.user.phone)}</p><p class="hint">${role==='cliente'?'Documento':'Documento / licencia / placa'}: ${esc(x.user.document)} ${role==='transportista'?'· '+esc(x.user.license)+' · '+esc(x.user.plate):''}</p><p class="hint">Empresa: ${esc(x.user.company)} · Observaciones: ${esc(x.notes||'—')}</p></div><span class="pill ${g==='aprobada'?'green':g==='rechazada'?'red':'amber'}">${g}</span></div>${g==='pendiente'?`<div class="actions"><button class="btn primary tiny" onclick="approveRegistration('${x.id}')">Aprobar acceso</button><button class="btn danger tiny" onclick="rejectRegistration('${x.id}')">Rechazar</button></div>`:''}</div>`).join('')||'<p class="hint">Sin solicitudes en esta categoría.</p>'}`).join(''))).join('')+`<p class="smallprint">Validación ilustrativa: no se consulta RENIEC, SUNARP, MTC ni una base de datos externa.</p>`;}
function approveRegistration(id){if(current.role!=='operaciones')return;let x=db.registrations.find(a=>a.id===id&&a.status==='pendiente');if(!x)return;x.status='aprobada';USERS.push(x.user);notify([x.user.id],'Tu cuenta fue aprobada. Ya puedes iniciar sesión con tu correo.','success');audit('Operaciones aprobó cuenta: '+x.user.name);save();render();toast('Acceso aprobado')}
function rejectRegistration(id){if(current.role!=='operaciones')return;let x=db.registrations.find(a=>a.id===id&&a.status==='pendiente');if(!x)return;x.status='rechazada';audit('Operaciones rechazó solicitud de '+x.user.name);save();render();toast('Solicitud rechazada')}
function inquiriesPage(){let isOps=current.role==='operaciones',visible=db.inquiries.filter(q=>isOps||q.from===current.id||q.to===current.id);return title('Centro de consultas',isOps?'Responde a clientes y transportistas y revisa el seguimiento de cada consulta.':'Envía una consulta a Operaciones y consulta sus respuestas.')+`<section class="card"><h2>Nueva consulta</h2><form id="newInquiry"><label class="label">Destinatario</label><select name="to">${(isOps?USERS.filter(u=>u.role!=='operaciones'):USERS.filter(u=>u.role==='operaciones')).map(u=>`<option value="${u.id}">${esc(u.role.toUpperCase())} — ${esc(u.name)}</option>`).join('')}</select><label class="label">Solicitud relacionada (opcional)</label><select name="rid"><option value="">Consulta general</option>${db.requests.filter(r=>isOps||r.client===current.id||r.winner===current.id||r.negotiations.some(n=>n.carrier===current.id)).map(r=>`<option value="${r.id}">${fmtId(r)} — ${esc(r.title)}</option>`).join('')}</select><label class="label">Asunto *</label><input name="subject" required maxlength="100" placeholder="Coordinación de recojo"><label class="label">Mensaje *</label><textarea name="body" required maxlength="800"></textarea><button class="btn primary" style="margin-top:10px">Enviar consulta</button></form></section>`+card('Conversaciones',visible.map(q=>`<div class="item"><div class="row between"><div><b>${esc(q.subject)}</b><p>${esc(user(q.from).name)} → ${esc(user(q.to).name)} ${q.rid?'· ST-'+String(q.rid).padStart(4,'0'):''}</p></div><span class="pill ${q.messages.length>1?'green':'amber'}">${q.messages.length>1?'Respondida':'Pendiente'}</span></div>${q.messages.map(m=>`<div class="notice info"><b>${esc(user(m.by).name)} · ${esc(m.at)}</b><div>${esc(m.body)}</div></div>`).join('')}<form onsubmit="event.preventDefault();replyInquiry('${q.id}',this.elements.body.value)"><label class="label">Responder</label><textarea name="body" required></textarea><button class="btn navy tiny">Enviar respuesta</button></form></div>`).join('')||'<div class="empty">No hay consultas registradas.</div>');}
function replyInquiry(id,msg){let q=db.inquiries.find(x=>x.id===id);if(!q||!(current.role==='operaciones'||q.to===current.id||q.from===current.id))return;q.messages.push({by:current.id,at:now(),body:msg});notify([q.from===current.id?q.to:q.from],'Respuesta a consulta: '+q.subject,'info');audit('Respuesta registrada a la consulta '+q.subject);save();render();toast('Respuesta enviada')}
const oldBindForms=bindForms;
bindForms=function(){oldBindForms();const f=$('newInquiry');if(f)f.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f)),q={id:'q'+Date.now(),from:current.id,to:d.to,rid:d.rid||null,subject:d.subject,messages:[{by:current.id,body:d.body,at:now()}]};db.inquiries.unshift(q);notify([d.to],'Nueva consulta: '+d.subject,'info');audit('Consulta enviada: '+d.subject);save();render();toast('Consulta enviada')}};
function manageRequest(id){let r=req(id);if(!r||current.id!==r.client||r.status!=='publicada'){toast('Sólo puedes editar solicitudes abiertas de tu propiedad.');return}modal(`<h2>Editar solicitud ${fmtId(r)}</h2><form id="editRequest"><label class="label">Carga *</label><input name="title" required value="${esc(r.title)}"><div class="fieldgrid"><div><label class="label">Origen *</label><input name="origin" required value="${esc(r.origin)}"></div><div><label class="label">Destino *</label><input name="destination" required value="${esc(r.destination)}"></div><div><label class="label">Fecha de recojo *</label><input type="date" name="pickup" required value="${esc(r.pickup)}"></div><div><label class="label">Peso en kg *</label><input type="number" name="weight" min="1" required value="${r.weight}"></div><div><label class="label">Presupuesto *</label><input type="number" name="price" min="1" required value="${r.price}"></div><div><label class="label">Bultos *</label><input type="number" name="units" min="1" required value="${r.units}"></div></div><label class="label">Indicaciones</label><textarea name="description">${esc(r.description)}</textarea><button class="btn primary" style="margin-top:10px">Guardar cambios y notificar</button></form>`);$('editRequest').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));Object.assign(r,{title:d.title,origin:d.origin,destination:d.destination,pickup:d.pickup,weight:+d.weight,price:+d.price,units:+d.units,description:d.description});notify(USERS.filter(u=>u.role==='transportista').map(u=>u.id),'Carga actualizada: '+fmtId(r)+' · '+r.origin+' → '+r.destination,'cargo');audit('Cliente modificó '+fmtId(r));save();openRequest(id);toast('Solicitud actualizada')}}
function removeRequest(id){let r=req(id);if(!r||current.id!==r.client||r.status!=='publicada')return;if(!confirm('¿Eliminar esta solicitud abierta? Las ofertas se cancelarán.'))return;r.status='eliminada';notify(USERS.filter(u=>u.role==='transportista').map(u=>u.id),'Carga eliminada: '+fmtId(r),'error');audit('Solicitud eliminada '+fmtId(r));save();modalClose();go('solicitudes');toast('Solicitud eliminada')}
openRequest=function(id){origOpenRequest(id);let r=req(id);if(!r)return;const host=$('modalroot').querySelector('.modal>div:last-child');if(!host)return;if(current.role==='cliente'&&r.client===current.id&&r.status==='publicada'){host.insertAdjacentHTML('beforeend',`<div class="actions"><button class="btn outline tiny" onclick="manageRequest(${id})">✎ Editar carga</button><button class="btn danger tiny" onclick="removeRequest(${id})">Eliminar carga</button></div>`)}if(current.role==='operaciones'){host.insertAdjacentHTML('beforeend',`<div class="light"><b>Identidades vinculadas a esta carga</b><p>Cliente: ${esc(user(r.client).name)} · ${esc(user(r.client).company)} · ${esc(user(r.client).phone||'')}</p>${r.negotiations.map(n=>`<p>Transportista: ${esc(user(n.carrier).name)} · ${esc(user(n.carrier).company)} · ${esc(user(n.carrier).phone||'')} · ${money(n.amount)}</p>`).join('')}</div>`)} };
usersPage=function(){if(current.role!=='operaciones')return '';return title('Directorio de usuarios','Perfiles separados y relaciones comerciales identificables.')+['cliente','transportista'].map(role=>card(role==='cliente'?'Clientes y remitentes':'Transportistas y flota',`<div class="tablewrap"><table><thead><tr><th>Usuario</th><th>Identificación</th><th>Contacto</th><th>${role==='cliente'?'Cargas':'Unidad / ofertas'}</th></tr></thead><tbody>${USERS.filter(u=>u.role===role).map(u=>`<tr><td><b>${esc(u.name)}</b><p class="hint">${esc(u.company)} · ${esc(u.city)}</p></td><td>${esc(u.document||'Verificado en demo')}</td><td>${esc(u.email)}<br>${esc(u.phone||'')}</td><td>${role==='cliente'?db.requests.filter(r=>r.client===u.id).length+' solicitudes':esc(u.truck||'—')+' · '+esc(u.plate||'—')+'<br>'+db.requests.reduce((a,r)=>a+r.negotiations.filter(n=>n.carrier===u.id).length,0)+' ofertas'}</td></tr>`).join('')}</tbody></table></div>`)).join('')};
availabilityPage=function(){let html=origAvailabilityPage();return html.replace(/onclick="closeAvailability\((\d+)\)"/g,'onclick="closeAvailability($1)"').replace(/(onclick="closeAvailability\((\d+)\)"[^>]*>Desactivar<\/button>)/g,`$1 <button class="btn outline tiny" onclick="editAvailability($2)">Editar</button>`)};
function editAvailability(id){let a=db.availability.find(x=>x.id===id);if(!a||a.carrier!==current.id||!a.active)return;modal(`<h2>Editar disponibilidad</h2><form id="editAvail"><label class="label">Origen</label><input name="origin" required value="${esc(a.origin)}"><label class="label">Destino</label><input name="destination" required value="${esc(a.destination)}"><label class="label">Fecha</label><input name="date" type="date" required value="${esc(a.date)}"><label class="label">Capacidad (kg)</label><input name="capacity" type="number" min="1" required value="${a.capacity}"><label class="label">Tarifa (S/)</label><input name="price" type="number" min="1" required value="${a.price}"><button class="btn primary" style="margin-top:10px">Guardar disponibilidad</button></form>`);$('editAvail').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));Object.assign(a,{origin:d.origin,destination:d.destination,date:d.date,capacity:+d.capacity,price:+d.price});notify(USERS.filter(u=>u.role==='cliente').map(u=>u.id),'Ruta disponible actualizada: '+a.origin+' → '+a.destination,'cargo');audit('Disponibilidad actualizada de '+current.name);save();modalClose();render();toast('Disponibilidad editada')}}
openPayment=function(id){const r=req(id);if(!r||!r.trip||current.role!=='cliente')return;const p=r.trip.payment,dep=p.deposit,bal=r.trip.amount-dep,kind=!p.depositPaid?'deposit':!p.balancePaid?'balance':null;modal(`<h2>Centro de pagos · ${fmtId(r)}</h2><div class="alert-strong"><b>Tarifa negociada: ${money(r.trip.amount)}</b><div>Transportista: ${esc(user(r.winner).company)} · Ruta: ${esc(r.origin)} → ${esc(r.destination)}</div></div><div class="metrics-row"><div class="metric"><span>ANTICIPO (30 %)</span><b>${money(dep)}</b><span>${p.depositPaid?'✔ Registrado':'Pendiente'}</span></div><div class="metric"><span>SALDO (70 %)</span><b>${money(bal)}</b><span>${p.balancePaid?'✔ Registrado':'Pendiente'}</span></div><div class="metric"><span>ESTADO DEL VIAJE</span><b>${esc(STAGES[r.trip.stage])}</b><span>Seguimiento simulado</span></div></div><div class="alert warn">Pago demostrativo: no se envían datos bancarios y ningún pago mueve dinero real.</div>${kind?`<h3>Pagar ${kind==='deposit'?'anticipo':'saldo'}: ${money(kind==='deposit'?dep:bal)}</h3>${kind==='balance'&&r.trip.stage<6?'<div class="notice cargo">Recomendamos registrar el saldo una vez confirmado el hito de entrega. En esta demo puedes continuar.</div>':''}<div class="payment-tabs"><button class="btn outline on" id="payTabCard" onclick="selectMethod('card')">💳 Tarjeta</button><button class="btn outline" id="payTabYape" onclick="selectMethod('yape')">🟣 Yape</button><button class="btn outline" id="payTabPlin" onclick="selectMethod('plin')">🔵 Plin</button></div><form id="pay"><input type="hidden" name="rid" value="${id}"><input type="hidden" name="kind" value="${kind}"><input type="hidden" name="method" value="Tarjeta (demo)"><div id="payDetails"></div><button class="btn primary full" style="margin-top:12px">Confirmar pago de prueba · ${money(kind==='deposit'?dep:bal)}</button></form>`:'<div class="notice success">✓ Anticipo y saldo registrados. Operación de prueba finalizada.</div>'}`);if(kind){selectMethod('card');bindForms()}};
function selectMethod(method){let labels={card:'Tarjeta (demo)',yape:'Yape (demo)',plin:'Plin (demo)'},f=$('pay');if(!f)return;f.elements.method.value=labels[method];for(let [m,suf] of [['card','Card'],['yape','Yape'],['plin','Plin']]){$('payTab'+suf)?.classList.toggle('on',m===method)}$('payDetails').innerHTML=method==='card'?`<div class="pay-face"><b>Pasarela de prueba · Tarjeta</b><div class="fieldgrid"><div><label class="label">Número de tarjeta de prueba *</label><input name="demoCard" required inputmode="numeric" pattern="[0-9 ]{16,19}" value="4242 4242 4242 4242" autocomplete="off"></div><div><label class="label">Titular ficticio *</label><input name="holder" required value="USUARIO DEMO" autocomplete="off"></div><div><label class="label">Vencimiento ficticio *</label><input name="expiry" required pattern="(0[1-9]|1[0-2])/[0-9]{2}" placeholder="12/30" value="12/30" autocomplete="off"></div><div><label class="label">CVV de prueba *</label><input name="cvv" required type="text" pattern="[0-9]{3}" value="123" autocomplete="off"></div></div><p class="hint">Valores exclusivamente ficticios y locales. No ingreses una tarjeta auténtica.</p></div>`:`<div class="pay-face"><h3>${method==='yape'?'Yape':'Plin'} — operación simulada</h3><p>1. Selecciona confirmar en la app ficticia.</p><p>2. Introduce el código de prueba <b>123456</b>.</p><label class="label">Código de autorización de prueba *</label><input name="approval" required pattern="123456" placeholder="123456" autocomplete="off"><p class="hint">No se genera QR real, no se abre ninguna app bancaria ni se hace transferencia.</p></div>`;}
const oldResetDemo=resetDemo;
resetDemo=function(){if(!confirm('¿Reiniciar toda la demo, incluidos registros y consultas?'))return;db=seed();db.registrations=[];db.inquiries=[];USERS=USERS.filter(u=>!u.id.startsWith('reg'));save();modalClose();tab='resumen';render();toast('Demostración restaurada')};

window.addEventListener('storage',e=>{if(e.key===KEY){try{db=JSON.parse(e.newValue)||seed();if(current)render()}catch{}}});render();
</script></body></html>
